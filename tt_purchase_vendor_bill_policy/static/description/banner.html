<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odoo Apps Banner - Purchase Vendor Bill Policy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --odoo-purple: #714B67;
            --odoo-teal: #00A09D;
            --odoo-dark: #1c151b;
            --odoo-grey: #5c4756;
            --bg-light: #faf9fa;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .banner-container {
            width: 1280px;
            height: 640px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 50px 100px rgba(113,75,103,0.08);
            overflow: hidden;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 100px;
            box-sizing: border-box;
            border: 1px solid rgba(113,75,103,0.06);
        }
        /* Mesh Gradients */
        .mesh {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.14;
            z-index: 1;
        }
        .mesh-1 { top: -200px; right: -200px; background: var(--odoo-teal); }
        .mesh-2 { bottom: -200px; left: -200px; background: var(--odoo-purple); }

        .content {
            position: relative;
            z-index: 10;
            max-width: 700px;
        }
        .brand {
            font-weight: 700;
            color: var(--odoo-grey);
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 58px;
            font-weight: 800;
            color: var(--odoo-dark);
            line-height: 1.15;
            margin: 0 0 16px 0;
            letter-spacing: -2px;
        }
        .subtitle {
            font-family: 'Caveat', cursive;
            font-size: 42px;
            color: var(--odoo-teal);
            margin: 0;
        }
        .badge-pro {
            margin-top: 40px;
            background: linear-gradient(135deg, var(--odoo-purple) 0%, #54374d 100%);
            color: white;
            padding: 10px 22px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 20px rgba(113, 75, 103, 0.2);
            letter-spacing: 0.5px;
        }
        .visual-container {
            position: absolute;
            right: 100px;
            top: 20px;
            bottom: 20px;
            width: 500px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .decoration-text {
            position: absolute;
            font-size: 200px;
            font-weight: 900;
            color: #f7f5f7;
            z-index: 0;
            bottom: -40px;
            right: 40px;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="mesh mesh-1"></div>
        <div class="mesh mesh-2"></div>
        <div class="decoration-text">POLICY</div>
        
        <!-- Logo Watermark Maximisé -->
        <div style="position: absolute; top: 10%; left: 0%; width: 1100px; opacity: 0.05; z-index: 0; pointer-events: none; transform: rotate(-8deg);">
            <img src="logo_full_taghrasthink.png" style="width: 100%; height: auto;">
        </div>
        
        <div class="content">
            <img src="logo_icon_taghrasthink.png"
                 style="height: 100px; width: 100px; margin-bottom: 30px; display: block;"
                 alt="TaghrasThink" />
            <h1>Purchase Vendor<br>Bill Policy</h1>
            <p class="subtitle">Hierarchical Control Rules</p>
            <div class="badge-pro">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                POLICY PROTOCOL ENABLED
            </div>
        </div>

        <div class="visual-container">
            <img src="icon.png" style="width: 320px; height: 320px; border-radius: 60px; filter: drop-shadow(0 20px 40px rgba(113,75,103,0.18)); border: 6px solid #ffffff;">
        </div>
    </div>
</body>
</html>
